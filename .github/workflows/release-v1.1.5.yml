name: Repack v1.1.5

on:
  push:
    tags:
      - v1.1.5-repack

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download release payload
        uses: actions/checkout@v4
        with:
          ref: release-assets-v1.1.5-repack
          path: payload
          fetch-depth: 1

      - name: Assemble and verify package
        shell: bash
        run: |
          cat payload/parts/part-* > ai-desensitizer-v1.1.5-Windows-x64.zip
          sha256sum -c payload/ai-desensitizer-v1.1.5-Windows-x64.zip.sha256

      - name: Replace public release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "v1.1.5" \
            ai-desensitizer-v1.1.5-Windows-x64.zip \
            payload/ai-desensitizer-v1.1.5-Windows-x64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "v1.1.5" \
            --repo "$GITHUB_REPOSITORY" \
            --title "数据脱敏工具 v1.1.5" \
            --notes-file payload/RELEASE_NOTES.md \
            --latest
